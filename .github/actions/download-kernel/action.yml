name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'

inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-01)'
    required: true
  kernel_source_commit:
    description: 'Pin kernel/common to this full 40-char commit SHA. Empty = follow branch tip.'
    required: false
    default: ''

outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}
  tag_fallback:
    description: 'Release tag used when the branch head was missing upstream'
    value: ${{ steps.sync.outputs.tag_fallback }}

runs:
  using: composite
  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"
        KERNEL_SOURCE_COMMIT="${{ inputs.kernel_source_commit }}"

        # Preflight the pin format early so we don't waste a full repo sync.
        if [ -n "$KERNEL_SOURCE_COMMIT" ] && ! [[ "$KERNEL_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::kernel_source_commit must be a full 40-char lowercase SHA, got: $KERNEL_SOURCE_COMMIT" >&2
          exit 1
        fi

        init_repo() {
          local depth="$1"
          local depth_flag=""
          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi
          repo init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} ${depth_flag} || { echo "ERROR: repo init failed" >&2; return 1; }
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}) || { echo "ERROR: git ls-remote failed" >&2; return 1; }
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          DEPRECATED=false
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
            echo "[!] Note: Branch ${FORMATTED_BRANCH} is considered deprecated."
            DEPRECATED=true
          fi
          echo "deprecated=$DEPRECATED" >> $GITHUB_OUTPUT
          TAG_FALLBACK=""
          if [ "$DEPRECATED" = "false" ] && [ -z "$REMOTE_BRANCH" ]; then
            LATEST_TAG=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
            if [ -n "$LATEST_TAG" ]; then
              echo "[!] Note: Branch ${FORMATTED_BRANCH} head missing upstream; using tag ${LATEST_TAG}."
              sed -i "/path=\"common\"/ s/revision=\"${FORMATTED_BRANCH}\"/revision=\"${LATEST_TAG}\"/" "$DEFAULT_MANIFEST_PATH"
              TAG_FALLBACK="$LATEST_TAG"
            else
              echo "WARNING: no head or tag found for ${FORMATTED_BRANCH}; sync will likely fail." >&2
            fi
          fi
          echo "tag_fallback=$TAG_FALLBACK" >> $GITHUB_OUTPUT
        }

        MAX_RETRIES=3
        RETRY_DELAY_SHORT=15
        SYNC_TIMEOUT="15m"
        attempt=1
        DEPTHS=(1 1 1)

        clean_workspace() {
          echo "Disk before cleanup:"
          df -h "$PWD" | tail -n +2 || true
          find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "Disk after cleanup:"
          df -h "$PWD" | tail -n +2 || true
        }

        while [ $attempt -le $MAX_RETRIES ]; do
          CURRENT_DEPTH="${DEPTHS[$((attempt-1))]}"
          echo "Attempt $attempt/$MAX_RETRIES: initialize and sync kernel repository (depth=${CURRENT_DEPTH}, sync timeout $SYNC_TIMEOUT)..."
          df -h "$PWD" | tail -n +2 || true
          if init_repo "$CURRENT_DEPTH"; then
            SYNC_TAG_FLAGS="--no-tags"
            if [ -n "$TAG_FALLBACK" ]; then SYNC_TAG_FLAGS=""; fi
            if timeout $SYNC_TIMEOUT repo sync -c --current-branch --no-clone-bundle $SYNC_TAG_FLAGS --jobs-checkout=4 -j4; then
              echo "Kernel repository initialization and sync succeeded on attempt $attempt."
              break
            else
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "repo sync timed out after $SYNC_TIMEOUT."
              else
                echo "repo sync failed with exit code $rc."
              fi
            fi
          else
            rc=$?
            echo "repo init or branch preflight failed with exit code $rc."
          fi

          if [ $attempt -lt $MAX_RETRIES ]; then
            echo "Cleaning workspace and retrying after ${RETRY_DELAY_SHORT}s..."
            clean_workspace || true
            sleep $RETRY_DELAY_SHORT
          else
            echo "All $MAX_RETRIES attempts failed." >&2
            exit $rc
          fi
          attempt=$((attempt+1))
        done

    - name: Pin Kernel Common Commit (optional)
      if: inputs.kernel_source_commit != ''
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PIN="${{ inputs.kernel_source_commit }}"

        if [ ! -d common/.git ]; then
          echo "::error::kernel/common is not a git checkout; cannot pin to $PIN." >&2
          exit 1
        fi

        cd common

        # repo sync used --depth=1, so the pinned SHA may not be present yet.
        # Fetch it explicitly; try shallow first, fall back to full fetch if
        # the remote refuses to serve an arbitrary shallow SHA.
        echo "Fetching pinned kernel/common commit: $PIN"
        if ! git fetch --depth=1 origin "$PIN" 2>/dev/null; then
          echo "Shallow fetch of $PIN failed; retrying with full fetch..."
          git fetch origin "$PIN"
        fi

        git checkout --detach "$PIN"
        actual="$(git rev-parse HEAD)"
        if [ "$actual" != "$PIN" ]; then
          echo "::error::kernel/common pin mismatch: wanted $PIN, got $actual." >&2
          exit 1
        fi
        echo "Pinned kernel/common to $PIN"
        echo "KERNEL_SOURCE_COMMIT_PINNED=$PIN" >> "$GITHUB_ENV"

    # --- Non-repo steps (commented out; we only use repo now) ---
    # ... （保持不变，省略） ...

    - name: Capture Kernel Common Commit Metadata
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [[ ! -d common ]]; then
          echo "WARNING: common folder not found; skipping commit metadata capture."
          exit 0
        fi

        cd common

        if [[ ! -d .git ]]; then
          echo "WARNING: common is not a git checkout; skipping commit metadata capture."
          exit 0
        fi

        COMMIT_DATE=$(git log -1 --format=%cI)
        COMMIT_MSG=$(git log -1 --format=%s)
        COMMIT_SHA=$(git rev-parse HEAD)

        # Enforce the pin if one was requested: mismatch here means either the
        # fetch/checkout above silently failed or something downstream moved HEAD.
        PIN="${{ inputs.kernel_source_commit }}"
        if [ -n "$PIN" ] && [ "$COMMIT_SHA" != "$PIN" ]; then
          echo "::error::Kernel source pin mismatch at capture time: wanted $PIN, got $COMMIT_SHA." >&2
          exit 1
        fi

        echo "KERNEL_SOURCE_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
        echo "Kernel common commit date: $COMMIT_DATE"
        echo "Kernel common commit msg: $COMMIT_MSG"
        echo "Kernel common commit SHA: $COMMIT_SHA"
        if [ -n "$PIN" ]; then
          echo "Kernel common commit is pinned to requested value."
        fi
