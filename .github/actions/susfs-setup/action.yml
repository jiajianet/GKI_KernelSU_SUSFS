name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo and cherry-pick commits'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = latest on auto-derived gki-{version} branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  root_flavor:
    description: 'Selected root implementation - pershoot patches only apply to next'
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        # Retry transient network errors (up to 5 attempts, 5s backoff).
        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning latest from $SUSFS_BRANCH..."
        retry git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        if [ -n "${{ inputs.susfs_commit }}" ]; then
          echo "Checking out SUSFS commit: ${{ inputs.susfs_commit }}"
          retry git -C "${{ github.workspace }}/susfs4ksu" checkout "${{ inputs.susfs_commit }}"
        fi

        cd "${{ github.workspace }}/susfs4ksu"
        SUSFS_COMMIT="$(git rev-parse HEAD)"
        echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
        echo "Using SUSFS commit: $SUSFS_COMMIT"

        # Pershoot 的补丁只针对 android14-6.1 + KernelSU-Next 组合，而且必须
        # 干净应用。其它版本 / 其它 root 一律跳过；cherry-pick 失败立即中止，
        # 绝不把带冲突标记的文件留给后续的 cp 步骤污染内核树。
        if [ "${{ inputs.root_flavor }}" = "next" ] && [ "${{ inputs.version }}" = "android14-6.1" ]; then
          PERSHOOT_REF="gki-android14-6.1-dev"
          echo "Fetching pershoot SUSFS commits from ${PERSHOOT_REF}..."
          if ! git fetch https://gitlab.com/pershoot/susfs4ksu.git "${PERSHOOT_REF}"; then
            echo "::error::Failed to fetch pershoot ${PERSHOOT_REF}." >&2
            exit 1
          fi

          # 先把要 cherry-pick 的 commit SHA 列出来（最早的在前），逐个应用。
          mapfile -t PERSHOOT_COMMITS < <(
            git log ..FETCH_HEAD --oneline -n 2 | awk '{print $1}' | tac
          )
          if [ "${#PERSHOOT_COMMITS[@]}" -eq 0 ]; then
            echo "No new pershoot commits to cherry-pick; skipping."
          else
            for sha in "${PERSHOOT_COMMITS[@]}"; do
              echo "Cherry-picking pershoot commit: ${sha}"
              if ! git cherry-pick "${sha}"; then
                echo "::error::cherry-pick of ${sha} failed; aborting to keep the tree clean." >&2
                git cherry-pick --abort || true
                exit 1
              fi
            done
          fi
        else
          echo "Skipping pershoot cherry-pick for version=${{ inputs.version }} root_flavor=${{ inputs.root_flavor }}."
        fi
